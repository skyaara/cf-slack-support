display_information:
  name: Customer Support
  description: Bidirectional customer support bridge (Durable Objects + WebSocket).
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: Support
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://support.example.com/slack/events
    bot_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
